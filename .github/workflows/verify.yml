name: Verify React Template
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: template-content/src/Client/package-lock.json
      - name: Verify NuGet generation
        shell: pwsh
        run: ./scripts/verify-template.ps1
