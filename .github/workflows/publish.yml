name: Publish NuGet Template

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, e.g. 0.2.0 (run from main)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-pack:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: template-content/src/Client/package-lock.json

      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $env:GITHUB_REF_NAME.Substring(1)
          } else { $env:MANUAL_VERSION }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid package version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify template package and generated application
        shell: pwsh
        run: ./scripts/verify-template.ps1

      - name: Pack release version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet pack Mkx.Templates.React.csproj -c Release -o artifacts -p:PackageVersion="${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw 'Pack failed' }
          $package = @(Get-ChildItem artifacts -Filter '*.nupkg')
          if ($package.Count -ne 1 -or $package[0].Name -ne "Mkx.Templates.React.${{ steps.version.outputs.version }}.nupkg") {
            throw 'NuGet package version mismatch'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ steps.version.outputs.version }}
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: verify-and-pack
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-${{ needs.verify-and-pack.outputs.version }}
          path: artifacts

      - name: NuGet login with GitHub OIDC (no permanent API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: mskhodadadi

      - name: Publish package to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          packages=(artifacts/*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then exit 1; fi
          dotnet nuget push "${packages[0]}" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
