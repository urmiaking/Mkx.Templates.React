name: Publish NuGet Template

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New NuGet version (for example 0.3.0); run from main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish already verified package
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require verified commit on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual release must run from main.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo 'Release commit must belong to main.' >&2
            exit 1
          }
          verified=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f per_page=25 \
            --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')
          if [[ "$verified" -lt 1 ]]; then
            echo "Full template CI for $GITHUB_SHA has not passed. Run/wait for Verify React Template." >&2
            exit 1
          fi
          echo "Verified by prior successful CI run for $GITHUB_SHA."

      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$REQUESTED_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid version: $version" >&2; exit 1;
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack and inspect template
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir artifacts
          dotnet pack Mkx.Templates.React.csproj -c Release -o artifacts -p:PackageVersion="$PACKAGE_VERSION" --nologo
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          version = os.environ['PACKAGE_VERSION']
          expected = f'Mkx.Templates.React.{version}.nupkg'
          packages = list(Path('artifacts').glob('*.nupkg'))
          if len(packages) != 1 or packages[0].name != expected:
              raise SystemExit(f'Unexpected NuGet outputs: {packages}')
          with ZipFile(packages[0]) as archive:
              names = archive.namelist()
          required = ['content/.template.config/template.json', 'content/Mkx.Templates.slnx',
                      'content/AGENTS.md', 'content/src/Client/package-lock.json']
          if any(x not in names for x in required):
              raise SystemExit('NuGet template content is incomplete')
          if any('/node_modules/' in x or '/obj/' in x or '/bin/' in x or x.endswith(('.db', '.pfx')) for x in names):
              raise SystemExit('Generated/sensitive files found in package')
          print(f'Validated {expected}')
          PY

      - name: NuGet OIDC login
        id: login
        uses: NuGet/login@v1
        with:
          user: mskhodadadi

      - name: Publish to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          packages=(artifacts/*.nupkg)
          dotnet nuget push "${packages[0]}" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
