name: Publish NuGet Template

on:
  workflow_run:
    workflows: ["Verify React Template"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit unused NuGet version; otherwise 0.3.<run_number>"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified main commit to NuGet.org
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Validate main commit and CI result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual releases must run on main.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo 'Release commit must belong to main.' >&2
            exit 1
          }
          verified=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f branch=main -f event=push -f per_page=25 \
            --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')
          if [[ "$verified" -lt 1 ]]; then
            echo "No successful main CI for $RELEASE_SHA. NuGet publication blocked." >&2
            exit 1
          fi

      - name: Resolve automatic NuGet version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-0.3.${GITHUB_RUN_NUMBER}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing NuGet version $version"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack and inspect NuGet template
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir artifacts
          dotnet pack Mkx.Templates.React.csproj -c Release -o artifacts -p:PackageVersion="$PACKAGE_VERSION" --nologo
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          version = os.environ['PACKAGE_VERSION']
          expected = f'Mkx.Templates.React.{version}.nupkg'
          packages = list(Path('artifacts').glob('*.nupkg'))
          if len(packages) != 1 or packages[0].name != expected:
              raise SystemExit(f'Unexpected NuGet output: {packages}')
          with ZipFile(packages[0]) as package:
              names = package.namelist()
          required = [
              'icon.png', 'NUGET_README.md',
              'content/.template.config/template.json', 'content/Mkx.Templates.slnx',
              'content/AGENTS.md', 'content/src/Client/package-lock.json'
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f'Missing NuGet content: {missing}')
          if any('/node_modules/' in name or '/obj/' in name or '/bin/' in name or
                 name.endswith(('.db', '.pfx', '.tsbuildinfo')) for name in names):
              raise SystemExit('Generated or sensitive file in NuGet package')
          print(f'Package {expected}: icon + README + template files validated')
          PY

      - name: Exchange OIDC credential with NuGet.org
        uses: NuGet/login@v1
        id: login
        with:
          user: mskhodadadi

      - name: Publish to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          packages=(artifacts/*.nupkg)
          dotnet nuget push "${packages[0]}" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json

      - name: Publication summary
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "### Mkx.Templates.React $PACKAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Published to [NuGet.org](https://www.nuget.org/packages/Mkx.Templates.React/$PACKAGE_VERSION)" >> "$GITHUB_STEP_SUMMARY"
