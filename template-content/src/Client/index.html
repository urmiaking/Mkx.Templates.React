<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0c7e75" />
    <meta name="description" content="Mkx React + ASP.NET Core starter" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Mkx Workspace</title>
    <script>
      try {
        const mode = localStorage.getItem('Theme.Mode') || localStorage.getItem('mkx-appearance')
        const palette = localStorage.getItem('Theme.Palette')
        document.documentElement.dataset.theme = mode === 'light' || mode === 'dark' ? mode :
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.palette = ['jade', 'ocean', 'iris', 'amber'].includes(palette) ? palette : 'jade'
      } catch { /* Private browsing may block storage; defaults remain accessible. */ }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
